<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>JK Eleições | Resultados</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background:
                radial-gradient(
                    circle at top,
                    #292929 0%,
                    #111 45%,
                    #050505 100%
                );
            color: white;
            min-height: 100vh;
        }

        header {
            height: 80px;
            background: #080808;
            border-bottom: 1px solid #d4af37;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 35px;
        }

        .logo {
            display: flex;
            flex-direction: column;
        }

        .logo strong {
            color: #d4af37;
            font-size: 25px;
            letter-spacing: 3px;
        }

        .logo span {
            color: #aaa;
            font-size: 12px;
            letter-spacing: 2px;
            margin-top: 3px;
        }

        .voltar {
            color: #d4af37;
            text-decoration: none;
            font-weight: bold;
        }

        main {
            width: 100%;
            max-width: 1100px;
            margin: 45px auto;
            padding: 0 20px;
        }

        .painel {
            background: #101010;
            border: 1px solid #333;
            border-radius: 18px;
            overflow: hidden;
            box-shadow:
                0 20px 60px rgba(0,0,0,.6),
                0 0 25px rgba(212,175,55,.08);
        }

        .topo {
            padding: 35px;
            text-align: center;
            border-bottom: 1px solid #333;
        }

        .topo h1 {
            color: #d4af37;
            font-size: 32px;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .topo p {
            color: #999;
        }

        .conteudo {
            padding: 35px;
        }

        .titulo-secao {
            color: #d4af37;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        h2 {
            font-size: 26px;
            margin-bottom: 25px;
        }

        .turmas {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(210px, 1fr));
            gap: 15px;
        }

        .turma {
            background: #171717;
            color: white;
            border: 1px solid #444;
            border-radius: 12px;
            padding: 20px;
            cursor: pointer;
            text-align: left;
            transition: .2s;
        }

        .turma:hover {
            border-color: #d4af37;
            transform: translateY(-3px);
        }

        .turma strong {
            display: block;
            color: #d4af37;
            font-size: 18px;
            margin-bottom: 7px;
        }

        .turma span {
            color: #888;
            font-size: 13px;
        }

        .resultado {
            display: none;
            margin-top: 35px;
        }

        .cabecalho-resultado {
            background: #151515;
            border: 1px solid #333;
            border-left: 4px solid #d4af37;
            border-radius: 10px;
            padding: 22px;
            margin-bottom: 25px;
        }

        .cabecalho-resultado h3 {
            color: #d4af37;
            font-size: 24px;
            margin-bottom: 8px;
        }

        .cabecalho-resultado p {
            color: #aaa;
            line-height: 1.5;
        }

        .resumo {
            display: grid;
            grid-template-columns:
                repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .resumo-card {
            background: #151515;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 22px;
            text-align: center;
        }

        .resumo-card span {
            display: block;
            color: #888;
            font-size: 12px;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .resumo-card strong {
            color: #d4af37;
            font-size: 30px;
        }

        .chapas {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .chapa {
            background: #151515;
            border: 1px solid #333;
            border-radius: 14px;
            padding: 25px;
            position: relative;
            overflow: hidden;
        }

        .chapa:hover {
            border-color: #d4af37;
        }

        .chapa-topo {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .numero {
            color: #d4af37;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 7px;
        }

        .nome {
            font-size: 24px;
            font-weight: bold;
        }

        .votos {
            text-align: right;
            min-width: 100px;
        }

        .votos strong {
            display: block;
            color: #d4af37;
            font-size: 30px;
        }

        .votos span {
            color: #888;
            font-size: 12px;
        }

        .pessoas {
            color: #aaa;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .barra {
            width: 100%;
            height: 10px;
            background: #292929;
            border-radius: 20px;
            overflow: hidden;
        }

        .barra-preenchimento {
            height: 100%;
            width: 0%;
            background: #d4af37;
            border-radius: 20px;
            transition: width .7s ease;
        }

        .porcentagem {
            color: #d4af37;
            font-size: 13px;
            font-weight: bold;
            margin-top: 8px;
            text-align: right;
        }

        .mensagem {
            background: #151515;
            border: 1px dashed #444;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            color: #888;
        }

        .erro {
            color: #ff9999;
            border-color: #773838;
        }

        .botoes {
            margin-top: 25px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        button {
            font-family: inherit;
        }

        .btn {
            background: transparent;
            color: #d4af37;
            border: 1px solid #d4af37;
            border-radius: 10px;
            padding: 13px 22px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn:hover {
            background: #d4af37;
            color: #080808;
        }

        @media (max-width: 700px) {

            header {
                padding: 0 18px;
            }

            .logo strong {
                font-size: 20px;
            }

            main {
                margin: 20px auto;
                padding: 0 10px;
            }

            .conteudo {
                padding: 25px 20px;
            }

            .resumo {
                grid-template-columns: 1fr;
            }

            .chapa-topo {
                flex-direction: column;
            }

            .votos {
                text-align: left;
            }

        }

    </style>

</head>


<body>

<header>

    <div class="logo">

        <strong>JK ELEIÇÕES</strong>

        <span>
            E.E. JOHN KENNEDY
        </span>

    </div>

    <a
        href="index.html"
        class="voltar"
    >
        ← Voltar
    </a>

</header>


<main>

    <div class="painel">

        <div class="topo">

            <h1>
                RESULTADOS
            </h1>

            <p>
                Acompanhe os resultados das eleições
                de representantes de turma.
            </p>

        </div>


        <div class="conteudo">

            <div class="titulo-secao">
                ETAPA 01
            </div>

            <h2>
                Selecione uma turma
            </h2>


            <div
                id="listaTurmas"
                class="turmas"
            >

                <div class="mensagem">
                    Carregando turmas...
                </div>

            </div>


            <div
                id="resultado"
                class="resultado"
            >

                <div
                    id="cabecalhoResultado"
                    class="cabecalho-resultado"
                ></div>


                <div
                    id="resumo"
                    class="resumo"
                ></div>


                <div
                    id="listaChapas"
                    class="chapas"
                ></div>


                <div class="botoes">

                    <button
                        class="btn"
                        onclick="voltarTurmas()"
                    >
                        ← ESCOLHER OUTRA TURMA
                    </button>

                </div>

            </div>

        </div>

    </div>

</main>


<script>

    const listaTurmas =
        document.getElementById(
            "listaTurmas"
        );

    const resultado =
        document.getElementById(
            "resultado"
        );

    const cabecalhoResultado =
        document.getElementById(
            "cabecalhoResultado"
        );

    const resumo =
        document.getElementById(
            "resumo"
        );

    const listaChapas =
        document.getElementById(
            "listaChapas"
        );


    // ==========================================
    // PROTEÇÃO CONTRA HTML
    // ==========================================

    function escaparHTML(valor) {

        return String(valor ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    // ==========================================
    // CARREGAR TURMAS
    // ==========================================

    async function carregarTurmas() {

        try {

            const resposta =
                await fetch("/api/turmas");

            const dados =
                await resposta.json();


            if (
                !dados.sucesso ||
                !dados.turmas ||
                dados.turmas.length === 0
            ) {

                listaTurmas.innerHTML = `
                    <div class="mensagem">
                        Nenhuma turma cadastrada.
                    </div>
                `;

                return;

            }


            listaTurmas.innerHTML = "";


            dados.turmas.forEach(
                turma => {

                    const botao =
                        document.createElement(
                            "button"
                        );

                    botao.className =
                        "turma";


                    botao.innerHTML = `

                        <strong>
                            ${escaparHTML(
                                turma.nome
                            )}
                        </strong>

                        <span>
                            Clique para visualizar
                            os resultados
                        </span>

                    `;


                    botao.onclick =
                        () => carregarResultado(
                            turma.id,
                            turma.nome
                        );


                    listaTurmas.appendChild(
                        botao
                    );

                }
            );


        } catch (erro) {

            console.error(erro);

            listaTurmas.innerHTML = `
                <div class="mensagem erro">
                    Não foi possível conectar
                    ao servidor.
                </div>
            `;

        }

    }


    // ==========================================
    // CARREGAR RESULTADO
    // ==========================================

    async function carregarResultado(
        turmaId,
        nomeTurma
    ) {

        listaChapas.innerHTML = `
            <div class="mensagem">
                Carregando resultados...
            </div>
        `;

        resultado.style.display =
            "block";


        try {

            const resposta =
                await fetch(
                    `/api/turmas/${turmaId}/resultados`
                );


            const dados =
                await resposta.json();


            if (
                !resposta.ok ||
                !dados.sucesso
            ) {

                listaChapas.innerHTML = `
                    <div class="mensagem erro">
                        ${
                            escaparHTML(
                                dados.mensagem ||
                                "Não foi possível carregar os resultados."
                            )
                        }
                    </div>
                `;

                return;

            }


            renderizarResultado(
                dados,
                nomeTurma
            );


            resultado.scrollIntoView({
                behavior: "smooth",
                block: "start"
            });


        } catch (erro) {

            console.error(erro);

            listaChapas.innerHTML = `
                <div class="mensagem erro">
                    Erro de conexão com o servidor.
                </div>
            `;

        }

    }


    // ==========================================
    // RENDERIZAR
    // ==========================================

    function renderizarResultado(
        dados,
        nomeTurma
    ) {

        const eleicao =
            dados.eleicao;


        cabecalhoResultado.innerHTML = `

            <h3>
                ${escaparHTML(
                    eleicao?.nome ||
                    "Eleição de Representantes"
                )}
            </h3>

            <p>
                Turma:
                <strong>
                    ${escaparHTML(
                        nomeTurma
                    )}
                </strong>

                ${
                    eleicao?.descricao
                    ? `
                        <br>
                        ${escaparHTML(
                            eleicao.descricao
                        )}
                    `
                    : ""
                }

            </p>

        `;


        resumo.innerHTML = `

            <div class="resumo-card">

                <span>
                    ELEITORES
                </span>

                <strong>
                    ${dados.totalEleitores}
                </strong>

            </div>


            <div class="resumo-card">

                <span>
                    VOTOS REGISTRADOS
                </span>

                <strong>
                    ${dados.totalVotos}
                </strong>

            </div>


            <div class="resumo-card">

                <span>
                    CHAPAS
                </span>

                <strong>
                    ${dados.resultados.length}
                </strong>

            </div>

        `;


        if (
            !dados.resultados ||
            dados.resultados.length === 0
        ) {

            listaChapas.innerHTML = `
                <div class="mensagem">
                    Nenhuma chapa cadastrada
                    nesta turma.
                </div>
            `;

            return;

        }


        listaChapas.innerHTML = "";


        dados.resultados.forEach(
            chapa => {

                const card =
                    document.createElement(
                        "div"
                    );

                card.className =
                    "chapa";


                card.innerHTML = `

                    <div class="chapa-topo">

                        <div>

                            <div class="numero">
                                CHAPA
                                ${escaparHTML(
                                    chapa.numero
                                )}
                            </div>

                            <div class="nome">
                                ${escaparHTML(
                                    chapa.nome
                                )}
                            </div>

                        </div>


                        <div class="votos">

                            <strong>
                                ${chapa.votos}
                            </strong>

                            <span>
                                voto(s)
                            </span>

                        </div>

                    </div>


                    <div class="pessoas">

                        <strong>
                            Representante:
                        </strong>

                        ${escaparHTML(
                            chapa.representante
                        )}

                        <br>

                        <strong>
                            Vice:
                        </strong>

                        ${escaparHTML(
                            chapa.vice
                        )}

                    </div>


                    <div class="barra">

                        <div
                            class="barra-preenchimento"
                            style="
                                width:
                                ${chapa.porcentagem}%;
                            "
                        ></div>

                    </div>


                    <div class="porcentagem">

                        ${chapa.porcentagem}%

                    </div>

                `;


                listaChapas.appendChild(
                    card
                );

            }
        );

    }


    // ==========================================
    // VOLTAR
    // ==========================================

    function voltarTurmas() {

        resultado.style.display =
            "none";

        listaChapas.innerHTML = "";

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }


    // ==========================================
    // INICIAR
    // ==========================================

    carregarTurmas();

</script>

</body>

</html>
